<!-- Lightbox -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lightbox-close" id="lbClose" aria-label="Close">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lbPrev" aria-label="Previous">&#8249;</button>
  <img id="lbImg" src="" alt="">
  <button class="lightbox-nav lightbox-next" id="lbNext" aria-label="Next">&#8250;</button>
  <p class="lightbox-cap" id="lbCap"></p>
</div>

<script src="../js/site.js" defer></script>
<script>
(function(){
  var items = Array.prototype.slice.call(document.querySelectorAll('#dogsGallery .dog-item'));
  var lb = document.getElementById('lightbox');
  var img = document.getElementById('lbImg');
  var cap = document.getElementById('lbCap');
  var idx = 0;
  function show(i){
    idx = (i + items.length) % items.length;
    var f = items[idx];
    img.src = f.getAttribute('data-full');
    img.alt = f.querySelector('img').alt;
    cap.textContent = f.getAttribute('data-cap') || '';
  }
  function open(i){ show(i); lb.classList.add('open'); lb.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden'; }
  function close(){ lb.classList.remove('open'); lb.setAttribute('aria-hidden','true'); document.body.style.overflow=''; }
  items.forEach(function(f,i){ f.addEventListener('click', function(){ open(i); }); });
  document.getElementById('lbClose').addEventListener('click', close);
  document.getElementById('lbNext').addEventListener('click', function(e){ e.stopPropagation(); show(idx+1); });
  document.getElementById('lbPrev').addEventListener('click', function(e){ e.stopPropagation(); show(idx-1); });
  lb.addEventListener('click', function(e){ if(e.target === lb) close(); });
  document.addEventListener('keydown', function(e){
    if(!lb.classList.contains('open')) return;
    if(e.key === 'Escape') close();
    if(e.key === 'ArrowRight') show(idx+1);
    if(e.key === 'ArrowLeft') show(idx-1);
  });
})();
</script>
